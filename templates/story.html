<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toxicity Scale | Taras Vive</title>
    <style>
        /* STYLE MATCHING THE ARCHIVE PAGE */
        :root { 
            --black: #000000; --white: #ffffff; --bg-red: #f17171; 
            --good: #50f096; --fair: #f0e63c; --poor: #ff5050;
            --font-main: 'Biscottini Trial', sans-serif;
        }

        body { font-family: var(--font-main); background: var(--bg-red); margin: 0; padding: 20px; color: var(--black); }
        .container { max-width: 1200px; margin: auto; }

        /* Navigation Links */
        .top-nav { margin-bottom: 10px; display: flex; gap: 30px; }
        .nav-link { color: var(--black); text-decoration: none; font-size: 1.5rem; }

        /* Hero Text */
        .hero-title { text-align: center; font-size: 8rem; color: var(--white); margin: 20px 0; line-height: 0.9; text-transform: uppercase; }
        
        /* Status Label showing which hour we are looking at */
        .hour-indicator { text-align: center; color: var(--white); font-size: 1.2rem; margin-bottom: 30px; }

        /* Tabs */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; background: var(--white); padding: 15px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .tab-btn { padding: 12px 25px; border-radius: 30px; border: 1px solid #ddd; background: transparent; font-family: var(--font-main); cursor: pointer; font-size: 1rem; }
        .tab-btn.active { background: var(--black); color: var(--white); }

        /* Toxicity Blocks */
        .level-row { display: flex; align-items: stretch; height: 120px; margin-bottom: 15px; transition: 0.4s; }
        .range-label { width: 180px; text-align: right; padding-right: 30px; display: flex; flex-direction: column; justify-content: center; font-weight: bold; font-size: 1.2rem; }

        .block-frame { flex: 2; border: 3px solid var(--black); border-radius: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.5s; background: transparent; }
        .block-frame span { opacity: 0.2; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; }

        .symptom-info { flex: 3; margin-left: 30px; background: var(--white); padding: 20px; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; opacity: 0.2; transition: 0.5s; }
        .symptom-info h4 { margin: 0; font-size: 1.3rem; font-weight: normal; }

        /* Active Interaction logic */
        .level-row.active .symptom-info { opacity: 1; transform: scale(1.02); }
        .level-row.active .block-frame span { opacity: 1; color: var(--black); }
        .active.lvl-good .block-frame { background: var(--good); border-color: var(--good); }
        .active.lvl-fair .block-frame { background: var(--fair); border-color: var(--fair); }
        .active.lvl-poor .block-frame { background: var(--poor); border-color: var(--poor); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="/" class="nav-link">HOME</a>
        <a href="/map" class="nav-link">MAP</a>
        <a href="/archive" class="nav-link">ARCHIVE</a>
    </div>

    <h1 class="hero-title">TOXICITY SCALE</h1>
    <div class="hour-indicator" id="time-display">Loading latest hour...</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchPollutant('no2')">NO2</button>
        <button class="tab-btn" onclick="switchPollutant('nh3')">NH3</button>
        <button class="tab-btn" onclick="switchPollutant('co')">CO</button>
    </div>

    <div class="dashboard" id="main-dashboard">
        <!-- Rows generated by JS -->
    </div>
</div>

<script>
    const pollutantData = {
        no2: { unit: "µg/m³", factor: 1.88, levels: [
            { class: "lvl-good", range: "0-40", label: "Good", title: "WHO Safe Limit", text: "Air quality is satisfactory. No health risks.", max: 40 },
            { class: "lvl-fair", range: "41-90", label: "Fair", title: "Moderate Exposure", text: "Sensitive groups may experience slight lung irritation.", max: 90 },
            { class: "lvl-poor", range: "91+", label: "Poor", title: "Unhealthy", text: "Significant respiratory distress likely.", max: 99999 }
        ]},
        nh3: { unit: "µg/m³", factor: 700, levels: [
            { class: "lvl-good", range: "0-270", label: "Safe", title: "WHO Health Level", text: "Clean air. No detectable mucous irritation.", max: 270 },
            { class: "lvl-fair", range: "271-350", label: "Noticeable", title: "Odor Threshold", text: "Pungent odor detectable.", max: 350 },
            { class: "lvl-poor", range: "351+", label: "Irritant", title: "Severe Irritation", text: "Immediate burning sensation in eyes and throat.", max: 99999 }
        ]},
        co: { unit: "mg/m³", factor: 1.15, levels: [
            { class: "lvl-good", range: "0-5", label: "Safe", title: "WHO Guideline", text: "Heart and brain oxygenation is normal.", max: 5 },
            { class: "lvl-fair", range: "6-10", label: "Fair", title: "EU Health Limit", text: "EU 8-hour legal limit.", max: 10 },
            { class: "lvl-poor", range: "11+", label: "Danger", title: "Toxic Level", text: "Headaches and reduced heart function likely.", max: 99999 }
        ]}
    };

    let currentPollutant = 'no2';
    let sensorVal = 0;

    function switchPollutant(p) {
        currentPollutant = p;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        build();
        updateUI();
    }

    function build() {
        const dashboard = document.getElementById('main-dashboard');
        const data = pollutantData[currentPollutant];
        const reversed = [...data.levels].reverse();
        dashboard.innerHTML = reversed.map((lvl) => `
            <div class="level-row ${lvl.class}" id="row-${lvl.label}">
                <div class="range-label">${lvl.range} ${data.unit}</div>
                <div class="block-frame"><span>${lvl.label}</span></div>
                <div class="symptom-info">
                    <h4>${lvl.title}</h4>
                    <p>${lvl.text}</p>
                </div>
            </div>
        `).join('');
    }

    function updateUI() {
        const data = pollutantData[currentPollutant];
        const metric = sensorVal * data.factor;
        
        // Reset all rows
        document.querySelectorAll('.level-row').forEach(r => r.classList.remove('active'));
        
        // Find which block is active
        for (let lvl of data.levels) {
            if (metric <= lvl.max) {
                document.getElementById(`row-${lvl.label}`).classList.add('active');
                break;
            }
        }
    }

    async function sync() {
        try {
            const r = await fetch('/api/toxicity-data');
            const data = await r.json();
            if (data.time) {
                sensorVal = data[currentPollutant];
                document.getElementById('time-display').innerText = "DATA FOR HOUR: " + data.time;
                updateUI();
            }
        } catch (e) { console.warn("No hourly archive data found yet."); }
    }

    build();
    sync();
    // Poll for new hourly data every 30 seconds
    setInterval(sync, 30000);
</script>
</body>
</html>
