<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sensors Map | Aria Bene Comune</title>
    <!-- Charting Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.0.1"></script>
    
    <style>
        @font-face { font-family: 'Biscottini'; src: url('../static/fonts/Biscottini-Regular.woff') format('woff'); font-weight: 400; }
        @font-face { font-family: 'SourceSerif4'; src: url('../static/fonts/SourceSerif4-Bold.otf.woff2') format('woff2'); font-weight: 700; }
        @font-face { font-family: 'SourceSerif4'; src: url('../static/fonts/SourceSerif4-Regular.otf.woff2') format('woff2'); font-weight: 400; }

        :root { 
            --black: #000000; 
            --white: #ffffff; 
            --orange: #3493e5; 
            --good: #50f096; --fair: #f0e63c; --poor: #ff5050;
            --font-header: 'Biscottini', sans-serif;
            --font-serif: 'SourceSerif4', serif;
        }

        * { border-radius: 0 !important; box-sizing: border-box; }

        body { 
            font-family: var(--font-serif); 
            background-color: var(--orange); 
            margin: 0; padding: 0; color: var(--black); 
            line-height: 1.3; text-transform: uppercase;
            overflow-x: hidden;
        }

        /* 1. NAVIGATION */
        .top-nav {
            background: var(--white); display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--black);
        }
        .nav-logo { font-family: var(--font-header); color: var(--black); font-size: 22px; text-decoration: none; }
        .nav-links { display: flex; }
        .nav-link { color: var(--black); text-decoration: none; font-family: var(--font-header); font-size: 15px; padding: 0 25px; border-left: 1px solid rgba(0,0,0,0.3); }
        .nav-link:hover { background: var(--black); color: var(--white); }

        /* 2. UI OVERLAY CONTROLS */
        .ui-controls { 
            position: absolute; top: 120px; left: 40px; z-index: 500; 
            width: 300px; display: flex; flex-direction: column; gap: 20px;
        }
        .control-card { 
            background: white; border: 1px solid var(--black); padding: 20px; 
        }
        .card-label { font-family: var(--font-header); font-size: 12px; color: #999; margin-bottom: 10px; display: block; }
        
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .input-group label { font-family: var(--font-header); font-size: 11px; margin-bottom: 5px; color: #888; }
        input, select { border: 1px solid var(--black); padding: 8px; font-family: var(--font-serif); font-size: 13px; background: white; width: 100%; }
        
        .btn { background: var(--black); color: white; border: none; padding: 10px; font-family: var(--font-header); cursor: pointer; font-size: 13px; width: 100%; margin-top: 10px; }
        .btn-live { background: white; color: black; border: 1px solid black; }
        .btn-live:hover { background: var(--black); color: white; }

        /* 3. MAP AREA */
        .map-wrapper { 
            width: 100vw; height: calc(100vh - 55px); 
            display: flex; align-items: center; justify-content: center; 
            background: var(--orange); position: relative; overflow: hidden;
        }
        #bg-image { 
            max-width: 90%; max-height: 90%; 
            filter: grayscale(100%) contrast(1.1) brightness(0.9);
            border: 1px solid var(--black);
        }

        /* Dots */
        .dot { 
            position: absolute; border-radius: 50% !important; border: 2px solid white; 
            background-color: var(--black); box-shadow: 0 0 0 1px var(--black);
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .dot:hover { transform: scale(1.2); outline: 4px solid rgba(0,0,0,0.1); }
        
        .status-good { background-color: var(--good) !important; }
        .status-fair { background-color: var(--fair) !important; }
        .status-poor { background-color: var(--poor) !important; }

        /* 4. SIDE PANEL (ARCHIVAL DRAWER) */
        #side-panel { 
            position: fixed; top: 55px; right: -450px; width: 450px; height: calc(100vh - 55px); 
            background: white; border-left: 1px solid var(--black); transition: 0.4s; padding: 40px; 
            z-index: 2000; overflow-y: auto;
        }
        #side-panel.open { right: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--black); padding-bottom: 15px; margin-bottom: 25px; }
        .panel-title { font-family: var(--font-header); font-size: 24px; margin: 0; }
        .close-btn { cursor: pointer; font-family: var(--font-header); font-size: 12px; background: none; border: 1px solid black; padding: 5px 10px; }

        .chart-container { margin-bottom: 30px; }
        .chart-label { font-family: var(--font-header); font-size: 14px; color: var(--orange); margin-bottom: 10px; display: block; border-bottom: 1px solid #eee; }
        canvas { height: 180px !important; }

        /* 5. TIMELINE SCRUBBER */
        #timeline-container { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 500px; background: white; border: 1px solid var(--black); padding: 20px;
            display: none; flex-direction: column; align-items: center; z-index: 1500;
        }
        #step-label { font-family: var(--font-header); font-size: 12px; margin-bottom: 10px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 2px; background: #ddd; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: var(--black); cursor: pointer; }

        /* 6. FLOATING ACTION */
        .floating-report-btn { position: fixed; bottom: 30px; left: 30px; display: flex; align-items: center; gap: 12px; text-decoration: none; z-index: 9999; }
        .icon-circle { width: 60px; height: 60px; background-color: var(--black); color: white; border-radius: 50% !important; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        @media (max-width: 1000px) { #side-panel { width: 100%; right: -100%; } .ui-controls { width: calc(100% - 80px); } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/" class="nav-logo">ARIA BENE COMUNE</a>
        <div class="nav-links">
            
            <a href="/symptoms" class="nav-link">SYMPTOMS</a>
            <a href="/map" class="nav-link">MAP</a>
            <a href="/archive" class="nav-link">ARCHIVE</a>
            <a href="/about" class="nav-link">ABOUT</a>
        </div>
    </nav>

    <div class="ui-controls">
        <div class="control-card">
            <span class="card-label">TEMPORAL_QUERY</span>
            <div class="input-group">
                <label>START_DATE</label>
                <input type="datetime-local" id="start-t">
            </div>
            <div class="input-group">
                <label>END_DATE</label>
                <input type="datetime-local" id="end-t">
            </div>
            <button class="btn" onclick="activateHistory()">EXECUTE_QUERY</button>
            <button class="btn btn-live" onclick="resetLive()">RETURN_LIVE</button>
        </div>

        <div class="control-card">
            <span class="card-label">POLLUTANT_VISUALIZATION</span>
            <select id="pollutant-select" onchange="refreshCurrentState()">
                <option value="none">DEFAULT_NODE_VIEW</option>
                <option value="no2">NITROGEN_DIOXIDE (NO2)</option>
                <option value="nh3">AMMONIA (NH3)</option>
                <option value="co">CARBON_MONOXIDE (CO)</option>
            </select>
        </div>
    </div>

    <div id="timeline-container">
        <div id="step-label">SCRUBBING_ARCHIVE_DATA...</div>
        <input type="range" id="time-slider" min="0" max="0" value="0" oninput="scrub(this.value)">
    </div>

    <div class="map-wrapper">
        <img id="bg-image" src="{{ url_for('static', filename='AQSTaranto.png') }}">
        <div id="dot-S1" class="dot" style="top: 40%; left: 35%; width: 25px; height: 25px;" onclick="openPanel('S1')"></div>
        <div id="dot-S2" class="dot" style="top: 60%; left: 65%; width: 25px; height: 25px;" onclick="openPanel('S2')"></div>
    </div>

    <div id="side-panel">
        <div class="panel-header">
            <h1 class="panel-title" id="p-title">NODE_00</h1>
            <button class="close-btn" onclick="closePanel()">CLOSE_X</button>
        </div>
        
        <div class="chart-container">
            <span class="chart-label">NO2_TELEMETRY</span>
            <canvas id="c-no2"></canvas>
        </div>
        <div class="chart-container">
            <span class="chart-label">NH3_TELEMETRY</span>
            <canvas id="c-nh3"></canvas>
        </div>
        <div class="chart-container">
            <span class="chart-label">CO_TELEMETRY</span>
            <canvas id="c-co"></canvas>
        </div>
    </div>

    <!-- Floating Report Button -->
    <a href="/report" class="floating-report-btn"><div class="icon-circle">!</div></a>

    <script>
        let charts = {}, activeSID = null, isLive = true, timelineData = [];
        const config = {
            no2: { f: 1.88, g: 40, m: 90, max: 200 },
            nh3: { f: 700,  g: 270, m: 350, max: 1000 },
            co:  { f: 1.15, g: 5, m: 7.5, max: 15 }
        };

        function init() {
            ['no2','nh3','co'].forEach(p => {
                const ctx = document.getElementById(`c-${p}`).getContext('2d');
                charts[p] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [{ label: '', data: [], borderColor: '#000', borderWidth: 1.5, pointRadius: 2, pointBackgroundColor: '#ff5500' }] },
                    options: { 
                        responsive: true, maintainAspectRatio: false,
                        plugins: { 
                            legend: { display: false },
                            annotation: { annotations: {
                                g: { type: 'box', yMin: 0, yMax: config[p].g, backgroundColor: 'rgba(80, 240, 150, 0.08)', borderWidth: 0 },
                                f: { type: 'box', yMin: config[p].g, yMax: config[p].m, backgroundColor: 'rgba(240, 230, 60, 0.08)', borderWidth: 0 },
                                p: { type: 'box', yMin: config[p].m, yMax: config[p].max, backgroundColor: 'rgba(255, 80, 80, 0.08)', borderWidth: 0 }
                            }}
                        },
                        scales: { 
                            x: { display: true, ticks: { display: false } },
                            y: { beginAtZero: true, max: config[p].max, ticks: { font: { family: 'SourceSerif4', size: 10 } } } 
                        }
                    }
                });
            });
            refreshCurrentState();
        }

        async function refreshCurrentState() {
            if (!isLive) return;
            const pollutant = document.getElementById('pollutant-select').value;
            for (let sid of ['S1', 'S2']) {
                const r = await fetch(`/api/sensor/${sid}`);
                const data = await r.json();
                if (data.length > 0) {
                    const latest = data[data.length - 1];
                    updateDotVisuals(sid, latest, pollutant);
                    if (sid === activeSID) updateGraphs(data);
                }
            }
        }

        async function activateHistory() {
            const s = document.getElementById('start-t').value;
            const e = document.getElementById('end-t').value;
            if(!s || !e) return;
            const r = await fetch(`/api/map-timeline?start=${s}&end=${e}`);
            timelineData = await r.json();
            if (timelineData.length > 0) {
                isLive = false;
                document.getElementById('timeline-container').style.display = 'flex';
                const slider = document.getElementById('time-slider');
                slider.max = timelineData.length - 1;
                slider.value = 0;
                scrub(0);
            }
        }

        function scrub(index) {
            const step = timelineData[index];
            const pType = document.getElementById('pollutant-select').value;
            document.getElementById('step-label').innerText = "TIMESTAMP: " + step.time;
            for (let sid in step.sensors) {
                updateDotVisuals(sid, step.sensors[sid], pType);
            }
        }

        function updateDotVisuals(sid, data, pType) {
            const dot = document.getElementById(`dot-${sid}`);
            if (!dot) return;
            if (pType === 'none') {
                dot.className = 'dot';
                dot.style.width = '25px'; dot.style.height = '25px';
                return;
            }
            const c = config[pType];
            const val = data[pType] * c.f;
            let status = 'good';
            if (val > c.m) status = 'poor'; else if (val > c.g) status = 'fair';
            dot.className = `dot status-${status}`;
            const size = 20 + (Math.min(val / c.max, 1) * 35);
            dot.style.width = size + 'px'; dot.style.height = size + 'px';
        }

        function updateGraphs(data) {
            const times = data.map(d => d.time.split(' ')[1] || d.time);
            ['no2','nh3','co'].forEach(p => {
                charts[p].data.labels = times;
                charts[p].data.datasets[0].data = data.map(d => (d[p] * config[p].f).toFixed(1));
                charts[p].update('none');
            });
        }

        function openPanel(sid) {
            activeSID = sid;
            document.getElementById('p-title').innerText = "NODE_" + sid.replace('S','0');
            document.getElementById('side-panel').classList.add('open');
            refreshCurrentState();
        }

        function closePanel() {
            document.getElementById('side-panel').classList.remove('open');
            activeSID = null;
        }

        function resetLive() {
            isLive = true;
            document.getElementById('timeline-container').style.display = 'none';
            refreshCurrentState();
        }

        init();
        setInterval(refreshCurrentState, 5000);
    </script>
</body>
</html>
